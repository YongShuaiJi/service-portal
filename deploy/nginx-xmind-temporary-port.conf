limit_req_zone $binary_remote_addr zone=xmind_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=xmind_conn_per_ip:10m;

server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xmind-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmind-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:xmind_ssl:10m;
    ssl_session_timeout 10m;

    client_max_body_size 21m;
    client_body_timeout 120s;

    location = /actuator/health {
        return 404;
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 429 '{"type":"/problems/rate-limited","title":"请求过于频繁","status":429,"detail":"请求触发限流，请稍后再试","code":"RATE_LIMITED"}';
    }

    location /api/ {
        limit_req zone=xmind_per_ip burst=3 nodelay;
        limit_conn xmind_conn_per_ip 4;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 18443;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 18443;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
