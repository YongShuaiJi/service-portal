# Canonical portal and ACME challenge endpoint.
server {
    listen 80;
    listen [::]:80;
    server_name yondavo.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://yondavo.com$request_uri;
    }
}

# Product subdomains use their own canonical HTTPS URLs.
server {
    listen 80;
    listen [::]:80;
    server_name xmind.yondavo.com kairo.yondavo.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Alternate brand domains always converge on the .com portal.
server {
    listen 80;
    listen [::]:80;
    server_name www.yondavo.com yondavo.cn www.yondavo.cn;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://yondavo.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yondavo.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yondavo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yondavo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:portal_ssl:10m;
    ssl_session_timeout 10m;

    root /var/www/service-portal/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"service-portal"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yondavo.com yondavo.cn www.yondavo.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yondavo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yondavo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://yondavo.com$request_uri;
}

