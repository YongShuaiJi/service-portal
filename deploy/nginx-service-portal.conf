server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xmind-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmind-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:portal_ssl:10m;
    ssl_session_timeout 10m;

    root /var/www/service-portal/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"service-portal"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
