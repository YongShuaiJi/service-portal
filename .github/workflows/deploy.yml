name: Verify and deploy Service Portal

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: npm

      - name: Install and test
        run: |
          set -Eeuo pipefail
          npm ci
          npm test

      - name: Build deployment artifact
        env:
          PORTAL_URL: https://${{ vars.ECS_HOST }}:18443/
          XMIND_URL: https://${{ vars.ECS_HOST }}/
          KAIRO_URL: https://${{ vars.ECS_HOST }}:18380/
        run: npm run build

      - name: Upload verified portal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-portal-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy static portal to Alibaba Cloud ECS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: service-portal-production
      cancel-in-progress: false
    environment:
      name: prod
      url: https://${{ vars.ECS_HOST }}:18443/
    steps:
      - name: Download verified portal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: service-portal-${{ github.sha }}
          path: dist

      - name: Configure pinned SSH connection
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ vars.ECS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$HOME/.ssh/portal_deploy"
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/portal_deploy" "$HOME/.ssh/known_hosts"

      - name: Publish static release
        env:
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_PORT: ${{ vars.ECS_PORT }}
          ECS_USER: ${{ vars.ECS_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -C dist -czf - . | ssh \
            -T \
            -i "$HOME/.ssh/portal_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$ECS_PORT" \
            "$ECS_USER@$ECS_HOST" \
            "deploy $GITHUB_SHA"

      - name: Verify public HTTPS portal
        env:
          PORTAL_URL: https://${{ vars.ECS_HOST }}:18443/
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --output /dev/null \
            "$PORTAL_URL"
