<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="纪永帅的工具空间：简洁、可靠、专注于解决真实问题。" />
    <meta property="og:title" content="纪永帅的工具空间" />
    <meta property="og:description" content="两个专注的工具，一个清晰的入口。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%PORTAL_URL%%" />
    <link rel="canonical" href="%%PORTAL_URL%%" />
    <link rel="stylesheet" href="./styles.css" />
    <title>纪永帅的工具空间</title>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="%%PORTAL_URL%%" aria-label="返回工具空间首页">
        <span class="brand-mark" aria-hidden="true">JY</span>
        <span>工具空间</span>
      </a>
      <div class="availability" aria-label="两个服务均已上线">
        <span class="status-dot" aria-hidden="true"></span>
        2 个服务在线
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">TOOLS, WITH INTENT.</p>
        <h1 id="hero-title">让复杂的工作，<br /><span>回归简单。</span></h1>
        <p class="hero-copy">
          两个专注的工具，一个清晰的入口。选择你需要的服务，然后开始工作。
        </p>
      </section>

      <section class="service-grid" aria-label="可用服务">
        <a class="service-card xmind-card" href="%%XMIND_URL%%">
          <div class="card-topline">
            <span class="service-icon xmind-icon" aria-hidden="true">X</span>
            <span class="service-state"><i aria-hidden="true"></i>在线</span>
          </div>
          <div class="card-content">
            <p class="service-kicker">文档效率</p>
            <h2>XMind 转测试用例</h2>
            <p>将思维导图快速转换为结构清晰、可直接使用的测试用例，让整理工作更轻松。</p>
          </div>
          <div class="card-footer">
            <span>打开服务</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </a>

        <a class="service-card kairo-card" href="%%KAIRO_URL%%">
          <div class="card-topline">
            <span class="service-icon kairo-icon" aria-hidden="true">K</span>
            <span class="service-state"><i aria-hidden="true"></i>在线</span>
          </div>
          <div class="card-content">
            <p class="service-kicker">JVM 工程</p>
            <h2>Kairo</h2>
            <p>面向 JVM 运行时的方法增强平台，提供注入、验证、卸载与恢复的完整工作流。</p>
          </div>
          <div class="card-footer">
            <span>进入 Kairo</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </section>
    </main>

    <footer>
      <p>为真实问题而构建，保持简单。</p>
      <a href="https://github.com/YongShuaiJi" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </footer>
  </body>
</html>
